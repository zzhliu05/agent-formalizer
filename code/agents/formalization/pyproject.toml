[project]
name = "formalization-agent-tools"
version = "0.1.0"
description = "Project-isolated runtime tools for the Lean formalization agent"
requires-python = ">=3.11"
dependencies = [
    "aristotlelib==2.1.0",
    "pydantic>=2.13,<3",
]

[project.scripts]
formalization-agent = "formalization_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formalization_agent"]
