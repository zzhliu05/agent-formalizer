[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-ocr-agent"
version = "0.1.0"
description = "Gemini-backed PDF OCR and theorem-context extraction agent"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pdf-ocr-agent = "pdf_ocr_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
