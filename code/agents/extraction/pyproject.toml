[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formal-math-extraction-agent"
version = "0.3.0"
description = "Gemini PDF-to-Markdown OCR and GPT-5.5 theorem extraction"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pdf-ocr-agent = "pdf_ocr_agent.cli:main"
theorem-extractor = "theorem_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_ocr_agent", "src/theorem_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
